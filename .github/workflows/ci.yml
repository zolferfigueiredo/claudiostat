name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:  # a newer push to the same branch replaces the run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # Package.swift needs Swift 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Any compiler warning fails the run.
      - run: swift test -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -warnings-as-errors

  scripts:
    name: Scripts and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version check compares with the base branch
      - run: shellcheck build.sh release.sh run.sh .githooks/pre-commit
      - name: A change to the app raises its version
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --quiet "$base"...HEAD -- Sources Package.swift Info.plist Icon; then echo "The app is unchanged."; exit 0; fi
          version() { git show "$1:Info.plist" | sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}'; }
          old=$(version "$base") new=$(version HEAD)
          if [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=Info.plist::The app changed, so CFBundleShortVersionString has to go above $old (it is $new)."
            exit 1
          fi
          echo "$old -> $new"

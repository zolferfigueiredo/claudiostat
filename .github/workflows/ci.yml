name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build and test
    # Package.swift needs Swift 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift build -c release
